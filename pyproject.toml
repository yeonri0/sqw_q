[project]
name = "sqw-q"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yeonri0", email = "yeonri0@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "qiskit-addon-aqc-tensor[quimb-jax]>=0.3.1",
    "qiskit-ibm-runtime>=0.50.0",
    "scipy>=1.17.1",
]

[project.scripts]
sqw-q = "sqw_q:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
